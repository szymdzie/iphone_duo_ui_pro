<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="444" fill="#F1F4F8"/>
  <rect x="0" y="0" width="6" height="444" fill="#0F6079"/>

  <text x="72" y="122" font-family="Menlo, monospace" font-size="42" font-weight="600" fill="#121A22">iphone_duo_ui_pro</text>
  <text x="72" y="170" font-size="25" fill="#121A22">Fold-aware Flutter widgets for iPhone Duo</text>
  <text x="72" y="210" font-size="16" fill="#55616E">vertical bars · reserved regions · hinge · two-pane · fold-aligned grids</text>

  <rect x="72" y="242" width="330" height="40" rx="6" fill="#FFFFFF" stroke="#D2DAE4"/>
  <text x="90" y="268" font-family="Menlo, monospace" font-size="15" fill="#0F6079">flutter pub add iphone_duo_ui_pro</text>

  <g font-size="13" font-family="Menlo, monospace">
    <rect x="72" y="302" width="64" height="24" rx="12" fill="#DCE9EF"/><text x="86" y="319" fill="#0F6079">MIT</text>
    <rect x="146" y="302" width="92" height="24" rx="12" fill="#DCE9EF"/><text x="160" y="319" fill="#0F6079">iOS 13+</text>
    <rect x="248" y="302" width="152" height="24" rx="12" fill="#DCE9EF"/><text x="262" y="319" fill="#0F6079">iOS 27.1 ready</text>
  </g>

  <!-- CLOSED: outer display 466 x 678 pt at 0.30. Hinge runs along the left edge,
       so those corners are tight; the camera sits in the top-right corner. -->
  <g>
    <path d="M 705 108 H 822 A 18 18 0 0 1 840 126 V 293 A 18 18 0 0 1 822 311 H 705 A 5 5 0 0 1 700 306 V 113 A 5 5 0 0 1 705 108 Z"
          fill="#FFFFFF" stroke="#B6C2CF" stroke-width="2"/>
    <line x1="703.5" y1="120" x2="703.5" y2="299" stroke="#B6C2CF" stroke-width="3" stroke-linecap="round"/>
    <rect x="818" y="118" width="13" height="19" rx="6.5" fill="#121A22" opacity="0.82"/>
    <rect x="815" y="145" width="19" height="148" rx="9.5" fill="#DCE9EF"/>
    <circle cx="824.5" cy="166" r="2.8" fill="#0F6079"/><circle cx="824.5" cy="192" r="2.8" fill="#0F6079"/>
    <circle cx="824.5" cy="218" r="2.8" fill="#0F6079"/><circle cx="824.5" cy="244" r="2.8" fill="#0F6079"/>
    <text x="700" y="338" font-family="Menlo, monospace" font-size="14" fill="#121A22">466 × 678 pt</text>
    <text x="700" y="357" font-size="12.5" fill="#55616E">closed · compact × regular</text>
    <text x="700" y="375" font-size="12" fill="#55616E">hinge on the left edge</text>
  </g>

  <!-- OPEN: inner display 951 x 669 pt, the orientation the device unfolds into.
       The fold is vertical through the middle; the camera hides under the top of the right half. -->
  <g>
    <rect x="900" y="110" width="285" height="201" rx="16" fill="#FFFFFF" stroke="#B6C2CF" stroke-width="2"/>
    <line x1="1042.5" y1="110" x2="1042.5" y2="311" stroke="#0F6079" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="1113" cy="129" r="5.5" fill="#F3E8D8" stroke="#8A5310" stroke-width="1.4"/>
    <text x="900" y="338" font-family="Menlo, monospace" font-size="14" fill="#121A22">951 × 669 pt</text>
    <text x="900" y="357" font-size="12.5" fill="#55616E">open · regular × regular</text>
    <text x="900" y="375" font-size="12" fill="#55616E">camera under the right half</text>
  </g>

  <!-- author -->
  <g>
    <defs>
      <clipPath id="avatarClip"><circle cx="96" cy="384" r="24"/></clipPath>
    </defs>
    <image href="data:image/jpeg;base64," x="66" y="354" width="60" height="60" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="96" cy="384" r="24" fill="none" stroke="#B6C2CF" stroke-width="1.5"/>
    <text x="134" y="379" font-size="15" fill="#121A22">Szymon Dziedzic</text>
    <text x="134" y="398" font-family="Menlo, monospace" font-size="12.5" fill="#0F6079">linkedin.com/in/dziedzic-szymon</text>
  </g>
</svg>
