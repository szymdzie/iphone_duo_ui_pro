name: iphone_duo_ui_pro
description: >-
  Fold-aware Flutter widgets for iPhone Duo: two-pane layouts, fold-aligned
  grids, and vertical bars in two modes, custom Flutter navigation or official
  Liquid Glass.
version: 0.3.0
repository: https://github.com/szymdzie/iphone_duo_ui_pro
issue_tracker: https://github.com/szymdzie/iphone_duo_ui_pro/issues
# The first screenshot is the thumbnail pub.dev shows in search results.
screenshots:
  - description: 'iPhone Duo simulator, half open: FoldAwareTwoPane splits on the fold and DuoAdaptiveScaffold moves navigation into the vertical bar.'
    path: screenshots/book-pose.png
  - description: 'Two modes for the bars: custom navigation drawn by Flutter, or official Liquid Glass drawn by UIKit through the optional companion package.'
    path: screenshots/two-modes.png
  - description: 'FoldAlignedGrid mirrors its columns around the hinge, so folding only widens the middle gap.'
    path: screenshots/fold-aligned-grid.png
  - description: 'The example while the simulator folds and unfolds. The angle in the caption is the one the native bridge reported.'
    path: screenshots/fold.gif
topics:
  - foldable
  - ios
  - layout
  - adaptive
  - responsive

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DuoBridge
