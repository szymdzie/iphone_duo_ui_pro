<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="440" fill="#F1F4F8"/>
  <text x="72" y="52" font-family="Menlo, monospace" font-size="22" font-weight="600" fill="#121A22">FoldAwareTwoPane · showDuoDialog</text>
  <text x="72" y="78" font-size="15" fill="#55616E">One list-and-detail layout across compact, flat and half-open states.</text>

  <!-- compact -->
  <text x="100" y="116" font-size="13" fill="#55616E" letter-spacing="1">COMPACT</text>
  <rect x="100" y="128" width="190" height="250" rx="16" fill="#FFFFFF" stroke="#B6C2CF" stroke-width="2"/>
  <g fill="#E7EDF3">
    <rect x="118" y="152" width="154" height="14" rx="7"/><rect x="118" y="176" width="120" height="14" rx="7"/>
    <rect x="118" y="200" width="154" height="14" rx="7"/><rect x="118" y="224" width="100" height="14" rx="7"/>
    <rect x="118" y="248" width="140" height="14" rx="7"/>
  </g>
  <text x="100" y="402" font-size="13.5" fill="#55616E">One pane at a time</text>

  <!-- flat, regular -->
  <text x="350" y="116" font-size="13" fill="#55616E" letter-spacing="1">FLAT · REGULAR WIDTH</text>
  <rect x="350" y="128" width="340" height="250" rx="16" fill="#FFFFFF" stroke="#B6C2CF" stroke-width="2"/>
  <line x1="479" y1="129" x2="479" y2="377" stroke="#D2DAE4" stroke-width="1.5"/>
  <g fill="#E7EDF3">
    <rect x="366" y="152" width="98" height="12" rx="6"/><rect x="366" y="172" width="80" height="12" rx="6"/>
    <rect x="366" y="192" width="98" height="12" rx="6"/><rect x="366" y="212" width="70" height="12" rx="6"/>
  </g>
  <g fill="#E7EDF3">
    <rect x="496" y="152" width="178" height="18" rx="9"/><rect x="496" y="182" width="178" height="90" rx="10"/>
    <rect x="496" y="284" width="140" height="12" rx="6"/>
  </g>
  <text x="350" y="402" font-size="13.5" fill="#55616E">startFraction 0.38</text>

  <!-- book pose -->
  <text x="750" y="116" font-size="13" fill="#0F6079" letter-spacing="1">BOOK POSE · SPLIT ON THE FOLD</text>
  <rect x="750" y="128" width="340" height="250" rx="16" fill="#FFFFFF" stroke="#B6C2CF" stroke-width="2"/>
  <rect x="914" y="128" width="12" height="250" fill="#0F6079" opacity="0.12"/>
  <line x1="920" y1="128" x2="920" y2="378" stroke="#0F6079" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="#E7EDF3">
    <rect x="766" y="152" width="132" height="12" rx="6"/><rect x="766" y="172" width="104" height="12" rx="6"/>
    <rect x="766" y="192" width="132" height="12" rx="6"/><rect x="766" y="212" width="90" height="12" rx="6"/>
    <rect x="766" y="232" width="132" height="12" rx="6"/>
  </g>
  <rect x="940" y="196" width="134" height="104" rx="12" fill="#DCE9EF" stroke="#0F6079" stroke-width="1.5"/>
  <text x="954" y="224" font-size="12.5" fill="#0F6079">Alert</text>
  <g fill="#0F6079" opacity="0.45"><rect x="954" y="238" width="106" height="8" rx="4"/><rect x="954" y="254" width="80" height="8" rx="4"/></g>
  <rect x="1006" y="274" width="54" height="16" rx="8" fill="#0F6079"/>
  <text x="750" y="402" font-size="13.5" fill="#55616E">Dialogs take the trailing half — and move there</text>
  <text x="750" y="421" font-size="13.5" fill="#55616E">if you fold while one is open.</text>
</svg>
